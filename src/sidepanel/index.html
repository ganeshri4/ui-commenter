<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comments Everywhere - Comments</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="panel-container">
    <!-- Top Header -->
    <header class="panel-header">
      <div class="brand-row">
        <div class="brand">
          <svg width="18" height="18" viewBox="0 0 38 57" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 28.5C19 23.2533 23.2533 19 28.5 19C33.7467 19 38 23.2533 38 28.5C38 33.7467 33.7467 38 28.5 38C23.2533 38 19 33.7467 19 28.5Z" fill="#18A0FB"/>
            <path d="M0 47.5C0 42.2533 4.25329 38 9.5 38H19V47.5C19 52.7467 14.7467 57 9.5 57C4.25329 57 0 52.7467 0 47.5Z" fill="#0ACF83"/>
            <path d="M19 0V19H28.5C33.7467 19 38 14.7467 38 9.5C38 4.25329 33.7467 0 28.5 0H19Z" fill="#FF7262"/>
            <path d="M0 9.5C0 14.7467 4.25329 19 9.5 19H19V0H9.5C4.25329 0 0 4.25329 0 9.5Z" fill="#F24E1E"/>
            <path d="M0 28.5C0 33.7467 4.25329 38 9.5 38H19V19H9.5C4.25329 19 0 23.2533 0 28.5Z" fill="#A259FF"/>
          </svg>
          <span class="brand-title">Comments Everywhere</span>
        </div>
        <div class="header-actions">
          <button id="refresh-btn" class="icon-btn" title="Refresh Comments"></button>
          <button id="settings-btn" class="icon-btn" title="Settings & Supabase Config"></button>
        </div>
      </div>

      <!-- Current Route Info -->
      <div class="route-bar">
        <span class="route-label">URL</span>
        <span id="current-url" class="route-value" title="Active URL">Loading current page…</span>
      </div>

      <!-- User Auth Header Banner -->
      <div id="auth-banner" class="auth-banner"></div>

      <!-- Tabs: Active vs Resolved -->
      <div class="tabs-row">
        <button id="tab-active" class="tab-btn active">
          Active <span id="count-active" class="badge">0</span>
        </button>
        <button id="tab-resolved" class="tab-btn">
          Resolved <span id="count-resolved" class="badge">0</span>
        </button>
      </div>

      <!-- Search / Filter input -->
      <div class="search-box">
        <input type="text" id="filter-input" placeholder="Filter comments or author…">
      </div>
    </header>

    <!-- Main Comment Threads List -->
    <main class="panel-main">
      <div id="comments-list" class="comments-list">
        <!-- Rendered dynamically -->
      </div>
      <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-icon">💬</div>
        <div class="empty-title">No comments on this route</div>
        <div class="empty-subtitle">Use the canvas overlay or DOM inspector to leave a comment.</div>
      </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Settings & Supabase Setup</h3>
          <button id="close-settings-btn" class="icon-btn">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Supabase URL</label>
            <input type="text" id="setting-supabase-url" placeholder="https://your-project.supabase.co">
          </div>
          <div class="form-group">
            <label>Supabase Anon Key</label>
            <input type="password" id="setting-supabase-key" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
          </div>
          <div class="form-group">
            <label>Extension Redirect URI (for OAuth)</label>
            <div class="copy-box">
              <input type="text" id="setting-redirect-uri" readonly>
              <button id="copy-redirect-btn" class="btn btn-secondary">Copy</button>
            </div>
            <p class="help-text">Add this exact URL to Supabase Auth -> Redirect URLs.</p>
          </div>
          <div class="form-actions">
            <button id="save-settings-btn" class="btn btn-primary">Save Settings</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="sidepanel.bundle.js"></script>
</body>
</html>
